# Protocol profile: HTBMS CAN V1.1.0.
#
# The supplied document identifies this as "振源 BMS CAN 通讯协议 Ver 1.1.0".
# It specifies 250/500 kbit/s selectable operation, 1 Hz active broadcasts,
# 29-bit IDs in the 0x1822xxxx family, little-endian fields and a battery-code
# suffix in the CAN ID. The exact BMS board model is not stated in the document.
# Public HTBMS/Hengtong information is only a possible vendor lead; it does not
# prove that this protocol and a particular commercial board are identical.
#
# This file describes the wire protocol only. The installed battery's serial,
# capacity, chemistry and current rating must come from its label or capture.
model:
  id: fc3da911-07a0-42b3-8cb4-1aa8dd26b558 # Stable unique profile ID.
  bms_model: HTBMS-CAN-V1.1.0 # Supplied protocol specification.

can:
  bitrate: 500000
  query_interval_ms: 1000
  response_timeout_ms: 1200

ros:
  topic: /batcan/data
  frame_id: battery
  localhost_only: true
  domain_id: 0
  qos_depth: 10

queries:
  - name: broadcast
    send_request: false
    responses:
      - name: htbms_status
        id: 0x18220000
        id_mask: 0x1FFF0000
        extended: true
        fields:
          - metric: voltage
            offset: 0
            length: 2
            encoding: uint
            endian: little
            scale: 0.1
            bias: 0
          - metric: current
            offset: 2
            length: 2
            encoding: int
            endian: little
            scale: 1
            bias: 0
          - metric: temperature
            offset: 4
            length: 1
            encoding: int
            endian: little
            scale: 1
            bias: 0
          - metric: percentage
            offset: 5
            length: 1
            encoding: uint
            endian: little
            scale: 0.005
            bias: 0
          - metric: status_low
            offset: 6
            length: 1
            encoding: uint
            endian: little
            scale: 1
            bias: 0
          - metric: status_high
            offset: 7
            length: 1
            encoding: uint
            endian: little
            scale: 1
            bias: 0
