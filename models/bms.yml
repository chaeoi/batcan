# Protocol profile: JBD CANBUS (public protocol match; exact board part number
# is not identified).
#
# The supplied CANBUS document matches the publicly available JBD CANBUS
# protocol: 500 kbit/s, 11-bit standard CAN, host RTR queries 0x100..0x110,
# big-endian values and Modbus CRC-16. It covers pack/capacity/protection data,
# up to six NTC values and cell-voltage pages through 30 cells.
#
# This protocol match does not prove a specific JBD hardware SKU and it does
# not identify the separately reported DALY K-series board. For DALY K-series
# (J24K3, 13S, 100A), capture the actual CAN/UART/RS485 traffic before adding a
# profile; the hardware name alone does not define a compatible wire protocol.
profile: jbd # Readable name; model.id below is the canonical selector.
model:
  id: d7a1d64a-6671-4ee2-8fbd-859043083a68 # Stable unique profile ID.
  bms_model: JBD-CANBUS # Publicly matched protocol family.

can:
  bitrate: 500000
  query_interval_ms: 2000
  response_timeout_ms: 50

ros:
  topic: /batcan/data
  frame_id: battery
  localhost_only: true
  domain_id: 0
  qos_depth: 10

