model:
  id: 2m_v0.1.2
  bms_model: KVMS

can:
  interface: can5
  query_interval_ms: 2000
  response_timeout_ms: 800

ros:
  topic: /bms_can/battery_data
  frame_id: battery
  localhost_only: true
  domain_id: 0
  qos_depth: 10

queries:
  - name: realtime
    send_request: true
    request:
      id: 0x0400FF80
      extended: true
      data: 00 00 00 00 00 00 00 00
    responses:
      - name: pack
        id: 0x04028000
        id_mask: 0x1FFFFF00
        extended: true
        fields:
          - metric: voltage
            offset: 0
            length: 2
            encoding: uint
            endian: big
            scale: 0.1
            bias: 0
          - metric: current
            offset: 2
            length: 2
            encoding: uint
            endian: big
            scale: 0.1
            bias: -3000
          - metric: percentage
            offset: 4
            length: 2
            encoding: uint
            endian: big
            scale: 0.001
            bias: 0
      - name: temperature
        id: 0x04038000
        id_mask: 0x1FFFFF00
        extended: true
        fields:
          - metric: temperature
            offset: 4
            length: 1
            encoding: uint
            endian: big
            scale: 1
            bias: -40
      - name: status
        id: 0x04078000
        id_mask: 0x1FFFFF00
        extended: true
        fields:
          - metric: power_supply_status
            offset: 0
            length: 1
            encoding: uint
            endian: big
            scale: 1
            bias: 0
            value_map: 0:3,1:1,2:2
