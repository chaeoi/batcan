name: Build and release batcan

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: batcan-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  version:
    name: 自动编号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.number.outputs.version }}
      released: ${{ steps.number.outputs.released }}
      latest: ${{ steps.number.outputs.latest }}
      skip: ${{ steps.number.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 计算版本并创建标签
        id: number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 - <<'PYCODE'
          import datetime
          import json
          import os
          import re
          import subprocess


          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()


          def parse_version(value):
              match = re.fullmatch(r"([2-9][0-9]{3})\.([1-9]|1[0-2])\.([1-9][0-9]*)", value)
              return tuple(map(int, match.groups())) if match else None


          def release(path):
              result = subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/{path}"], text=True, capture_output=True)
              if result.returncode:
                  if "HTTP 404" in result.stderr:
                      return None
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout)


          def output(version="", released=False, latest=False, skip=False):
              values = {"version": version, "released": str(released).lower(), "latest": str(latest).lower(), "skip": str(skip).lower()}
              with open(os.environ["GITHUB_OUTPUT"], "a") as destination:
                  destination.write("".join(f"{name}={value}\n" for name, value in values.items()))


          head = os.environ["GITHUB_SHA"]
          date = datetime.datetime.fromisoformat(git("show", "-s", "--format=%cI", head)).astimezone(datetime.timezone.utc)
          prefix = (date.year, date.month)
          tags = []
          for line in git("for-each-ref", "--format=%(refname:strip=2) %(objectname) %(*objectname)", "refs/tags").splitlines():
              name, target, *peeled = line.split()
              number = parse_version(name)
              if number:
                  tags.append((number, peeled[0] if peeled else target))
          assigned = [number for number, target in tags if target == head]
          if assigned:
              number = max(assigned)
          else:
              # An older queued commit must not acquire a higher version than its successor.
              for target in {target for _, target in tags}:
                  result = subprocess.run(["git", "merge-base", "--is-ancestor", head, target])
                  if result.returncode == 0:
                      output(skip=True)
                      print("Skipping an unversioned commit superseded by a newer versioned commit.")
                      raise SystemExit(0)
                  if result.returncode != 1:
                      raise RuntimeError("cannot compare release commit ancestry")
              sequence = max((number[2] for number, _ in tags if number[:2] == prefix), default=0) + 1
              number = (*prefix, sequence)
          if not 0 < number[2] <= 4294967295:
              raise RuntimeError("release sequence is out of range")
          version = ".".join(map(str, number))
          if not assigned:
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subject = git("show", "-s", "--format=%s", head)
              subprocess.run(["git", "tag", "-a", "--cleanup=verbatim", version, head, "-m", f"## 更新内容\n\n- {subject}\n"], check=True)
              subprocess.run(["git", "push", "origin", f"refs/tags/{version}"], check=True)
          existing = release(f"tags/{version}")
          if existing and existing["draft"]:
              subprocess.run(["gh", "release", "delete", version, "--repo", os.environ["GITHUB_REPOSITORY"], "--yes"], check=True)
              existing = None
          latest = release("latest")
          promote = not latest or number > parse_version(latest["tag_name"])
          output(version, released=bool(existing), latest=promote)
          print(f"Release version: {version}")
          PYCODE

  build:
    name: Build Linux ${{ matrix.arch }}
    needs: [version]
    if: needs.version.outputs.skip != 'true' && needs.version.outputs.released != 'true'
    env:
      VERSION: ${{ needs.version.outputs.version }}
    runs-on: ${{ matrix.runner }}
    container: ros:humble-ros-base-jammy
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ros-humble-ament-cmake
      - name: Build and test
        run: |
          . /opt/ros/humble/setup.sh
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DBATCAN_VERSION="$VERSION"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          mkdir -p dist
          cp build/batcan dist/batcan-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: batcan-${{ matrix.arch }}
          path: dist/batcan-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, build]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH_LATEST: ${{ needs.version.outputs.latest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: batcan-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum batcan-linux-* > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          if [ "$(git cat-file -t "$VERSION")" = tag ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$VERSION" > "$notes"
          else
            printf 'batcan %s 正式版。\n' "$VERSION" > "$notes"
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION"
          {
            printf '\n## 安装与升级\n\n'
            printf '[安装、配置和服务管理](https://github.com/%s/blob/%s/README.md#安装与快速上手)。运行环境为 Linux 与 ROS2 Humble。\n' "$GITHUB_REPOSITORY" "$VERSION"
            printf '\n## 下载\n\n'
            printf '| Linux 架构 | 程序 |\n|---|---|\n'
            for arch in amd64 arm64; do
              printf '| %s | [batcan-linux-%s](%s/batcan-linux-%s) |\n' "$arch" "$arch" "$base" "$arch"
            done
            printf '\n## SHA-256\n\n下载附件 \140SHA256SUMS\140 后，可用 \140sha256sum --check --ignore-missing SHA256SUMS\140 校验。\n\n\140\140\140text\n'
            cat dist/SHA256SUMS
            printf '\140\140\140\n'
          } >> "$notes"
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [[ "$previous" =~ ^[2-9][0-9]{3}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]] && [ "$previous" != "$VERSION" ]; then
            printf '\n' >> "$notes"
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$VERSION" -f previous_tag_name="$previous" --jq .body >> "$notes"
          fi
          gh release create "$VERSION" dist/batcan-linux-amd64 dist/batcan-linux-arm64 dist/SHA256SUMS \
            --verify-tag --title "batcan $VERSION" --notes-file "$notes" --latest="$PUBLISH_LATEST"
